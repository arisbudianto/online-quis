<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidak Ada Koneksi - Kuis Online</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F4F4F2;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 24px;
        }
        .box { max-width: 360px; }
        .logo { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-bottom: 16px; }
        .logo span { width: 14px; height: 14px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #555; font-size: 14px; line-height: 1.5; }
        button {
            margin-top: 16px; background: #111; color: #fff; border: none;
            padding: 10px 20px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">
            <span style="background:#DC3B1C"></span>
            <span style="border:1px solid #000"></span>
            <span style="background:#000"></span>
            <span style="border:1px solid #000"></span>
        </div>
        <h1>Tidak Ada Koneksi Internet</h1>
        <p>
            Kuis Online butuh koneksi internet aktif untuk mengerjakan kuis (jawaban
            disimpan otomatis ke server secara real-time). Periksa koneksi Anda lalu
            coba lagi.
        </p>
        <button onclick="window.location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
